services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: faces
      MODEL_DIR: /app/models
      LIVENESS_MODEL_PATH: /app/models/liveness/minifasnet_v2.onnx
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g

  api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: faces
      MODEL_DIR: /app/models
      LIVENESS_MODEL_PATH: /app/models/liveness/minifasnet_v2.onnx
      FACE_DEVICE: auto
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    cpus: "2.0"
    mem_limit: 4g

volumes:
  qdrant_data:
